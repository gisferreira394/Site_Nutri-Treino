<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutri&Treino</title>
  <link rel="stylesheet" href="css/stylevisualproduto.css">
</head>
<body>
  <div class="produto">

    <!-- IMAGENS -->
    <div class="imagens">
        <div class="miniaturas">
            <img src="imgbarrinha/avelã.png" onclick="trocarImagem(this)">
            <img src="imgbarrinha/Banoffee.png" onclick="trocarImagem(this)">
        </div>

        <div class="principal">
            <img id="imgPrincipal" src="imgbarrinha/café.png">
        </div>
    </div>

    <!-- INFO -->
    <div class="info">
        <h2 id="nomeProduto">Pulseira Prata 925 Coração</h2>

        <p class="preco">R$ <span id="precoProduto">319.90</span></p>

        <p>prateda de forma reluzente</p>

        <!-- QUANTIDADE -->
        <div class="quantidade">
            <button onclick="diminuir()">-</button>
            <span id="qtd">1</span>
            <button onclick="aumentar()">+</button>
        </div>

        <!-- AÇÕES -->
        <div class="acoes">
            <button class="comprar" onclick="comprar()">🛒 Comprar</button>
            <button class="fav" onclick="favoritar()">❤️</button>
        </div>

    </div>

</div>

<script>
let quantidade = 1;

function trocarImagem(img) {
    document.getElementById("imgPrincipal").src = img.src;
}

function aumentar() {
    quantidade++;
    document.getElementById("qtd").innerText = quantidade;
}

function diminuir() {
    if (quantidade > 1) {
        quantidade--;
        document.getElementById("qtd").innerText = quantidade;
    }
}

// 🛒 COMPRAR (adiciona + vai pro carrinho)
function comprar() {

    let produto = {
        nome: document.getElementById("nomeProduto").innerText,
        preco: document.getElementById("precoProduto").innerText,
        imagem: document.getElementById("imgPrincipal").src,
        quantidade: quantidade
    };

    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

    carrinho.push(produto);

    localStorage.setItem("carrinho", JSON.stringify(carrinho));

    // 🔥 REDIRECIONA
    window.location.href = "carrinho.html";
}

// ❤️ FAVORITOS (não sai da página)
function favoritar() {

    let produto = {
        nome: document.getElementById("nomeProduto").innerText,
        imagem: document.getElementById("imgPrincipal").src
    };

    let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

    favoritos.push(produto);

    localStorage.setItem("favoritos", JSON.stringify(favoritos));

    alert("Adicionado aos favoritos!");
}
</script>
  
</body>
</html>
