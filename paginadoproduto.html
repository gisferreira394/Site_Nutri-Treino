<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto | Nutri&Treino</title>
    <link rel="stylesheet" href="css/stylevisualproduto.css">
</head>
<body>

<div class="produto">

    <!-- IMAGENS -->
    <div class="imagens">

        <!-- Miniaturas (opcional – pode remover se quiser) -->
        <div class="miniaturas">
            <img id="mini1" onclick="trocarImagem(this)">
            <img id="mini2" onclick="trocarImagem(this)">
        </div>

        <!-- Imagem principal -->
        <div class="principal">
            <img id="imgPrincipal" alt="Imagem do produto">
        </div>
    </div>

    <!-- INFO -->
    <div class="info">
        <h2 id="nomeProduto"></h2>

        <p class="preco">
            R$ <span id="precoProduto"></span>
        </p>

        <p id="descricaoProduto"></p>

        <!-- QUANTIDADE -->
        <div class="quantidade">
            <button onclick="diminuir()">-</button>
            <span id="qtd">1</span>
            <button onclick="aumentar()">+</button>
        </div>

        <!-- AÇÕES -->
        <div class="acoes">
            <button class="comprar" onclick="comprar()">🛒 Comprar</button>
            <button class="fav" onclick="favoritar()">❤️</button>
        </div>
    </div>

</div>
<script>
/* =======================
   CARREGAR PRODUTO DA URL
======================= */
const params = new URLSearchParams(window.location.search);

const nome  = params.get("nome");
const preco = params.get("preco");
const img   = params.get("img");
const desc  = params.get("desc");

if (!nome || !preco || !img) {
    alert("Produto inválido!");
}

/* Preenche os dados na página */
document.getElementById("nomeProduto").innerText = nome;
document.getElementById("precoProduto").innerText = preco;
document.getElementById("descricaoProduto").innerText =
    desc || "Produto de alta qualidade Nutri&Treino.";

document.getElementById("imgPrincipal").src = img;

/* Miniaturas (usam a mesma imagem por enquanto) */
document.getElementById("mini1").src = img;
document.getElementById("mini2").src = img;

/* =======================
   QUANTIDADE
======================= */
let quantidade = 1;

function aumentar() {
    quantidade++;
    document.getElementById("qtd").innerText = quantidade;
}

function diminuir() {
    if (quantidade > 1) {
        quantidade--;
        document.getElementById("qtd").innerText = quantidade;
    }
}

function trocarImagem(el) {
    document.getElementById("imgPrincipal").src = el.src;
}

/* =======================
   COMPRAR
======================= */
function comprar() {
    const produto = {
        nome,
        preco,
        imagem: img,
        quantidade
    };

    const carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
    carrinho.push(produto);

    localStorage.setItem("carrinho", JSON.stringify(carrinho));
    window.location.href = "carrinho.html";
}

/* =======================
   FAVORITOS
======================= */
function favoritar() {
    const favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

    favoritos.push({
        nome,
        imagem: img
    });

    localStorage.setItem("favoritos", JSON.stringify(favoritos));
    alert("Produto adicionado aos favoritos!");
}
</script>
