<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favoritos | Nutri&Treino</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
}

/* HEADER */
header {
    background: #387856;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: 30px auto;
}

/* CARD */
.card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    padding: 15px;
    margin-bottom: 15px;
}

.card img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 10px;
    margin-right: 15px;
}

.info {
    flex: 1;
}

.remover {
    background: #f44336;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.voltar {
    display: inline-block;
    margin-bottom: 20px;
    text-decoration: none;
    background: #387856;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
}
</style>
</head>

<body>

<header>❤️ Meus Favoritos</header>

<div class="container">

    <div style="text-align:center; margin: 20px 0;">
   <a href="index.html" class="voltar">
    🏠 Voltar para a página inicial
</a>

</div>
    <div id="listaFavoritos"></div>
</div>

<script>
const lista = document.getElementById("listaFavoritos");
let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

function renderizarFavoritos() {

    lista.innerHTML = "";

    if (favoritos.length === 0) {
        lista.innerHTML = "<p>Nenhum produto favoritado.</p>";
        return;
    }

favoritos.forEach((p, index) => {
    lista.innerHTML += `
        <div class="card">
            <img src="${p.imagem}" alt="${p.nome}">
            
            <div class="info">
                <strong>${p.nome}</strong><br>
                R$ ${p.preco}
            </div>

            <button class="remover" onclick="removerFavorito(${index})">
                Remover
            </button>
        </div>
        `;
    });
}

function removerFavorito(index) {
    favoritos.splice(index, 1);
    localStorage.setItem("favoritos", JSON.stringify(favoritos));
    renderizarFavoritos();
}

renderizarFavoritos();
</script>

</body>
</html>
``
