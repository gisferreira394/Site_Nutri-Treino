<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Meus Pedidos</title>



<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.box {
    max-width: 800px;
    margin: 30px auto;
}

.pedido {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.status {
    font-weight: bold;
    color: #387856;

}

.btn-home {
    display: inline-block;
    background: #387856;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

.btn-home:hover {
    background: #388e3c;
}
</style>
</head>
<body>

<h1 style="text-align:center">📦 Meus Pedidos</h1>

<div style="text-align:center; margin: 20px 0;">
    <a href="index.html" class="btn-home">
        🏠 Voltar para a página inicial
    </a>
</div>


<div class="box" id="listaPedidos"></div>

<script>
const pedidos = JSON.parse(localStorage.getItem("pedidos")) || [];
const lista = document.getElementById("listaPedidos");

if (pedidos.length === 0) {
    lista.innerHTML = "<p style='text-align:center'>Nenhum pedido encontrado.</p>";
}

pedidos.forEach(p => {
    lista.innerHTML += `
        <div class="pedido">
            <p><strong>Pedido:</strong> ${p.id}</p>
            <p><strong>Data:</strong> ${p.data}</p>
            <p><strong>Total:</strong> R$ ${p.total}</p>
            <p class="status">Status: ${p.status}</p>
        </div>
    `;
});
</script>


</body>
</html>
